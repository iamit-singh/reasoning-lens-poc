# Local dev, test AND demo environment -- there is no other one (ADR-003: local-only).
#
# The local generation model is NOT in this file on purpose. Containerised inference on
# macOS loses Metal, so the model is served natively (`ollama serve`) and reached at
# host.docker.internal / localhost.
#
# **Redis was here and is gone (ADR-011).** One process, one operator: every job Redis had
# -- shared cache, shared rate counter, shared spend total -- was coordination between
# replicas that do not exist. It could not make this demo more reliable and it could
# absolutely make it less, by being down. The cache is the filesystem and the breaker is a
# file. So this compose file now has ONE service and no healthcheck to wait on.
services:
  app:
    build: .
    environment:
      # MOCK_LLM=1 is the default here on purpose: local dev is cost-free and
      # deterministic, and the frontend can develop against cassettes (C7.1).
      MOCK_LLM: "1"
      DEMO_MODE: "cached"
      ANALYZER_BACKEND: "${ANALYZER_BACKEND:-hybrid}"
      # reach the natively-served local model from inside the container
      LOCAL_BASE_URL: "http://host.docker.internal:11434/v1"
      LOCAL_MODEL: "${LOCAL_MODEL:-gpt-oss:20b}"
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./analyzer:/app/analyzer
      - ./backend:/app/backend
