# C7.2 every-PR job set. All jobs must pass.
#
# Two notes on scope, both deliberate:
#  * The measurement jobs (calibrate --dev on prompt PRs, the nightly suite) cost LLM
#    spend and need a restricted API key. They are declared in ci-measurement.yml and
#    stay disabled until M2-1 exists to be run.
#  * Jobs whose tests are owned by a later task are wired now and report their
#    emptiness loudly (scripts/run_marker.sh). A job that exists from W1 costs nothing;
#    the same job added in W6 costs a refactor.
name: pr

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  MOCK_LLM: "1"
  DEMO_MODE: "cached"

jobs:
  lint-python:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: lint (mypy, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      - working-directory: analyzer
        run: mypy

  lint-frontend:
    name: lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run lint

  unit:
    name: unit (deterministic, no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      - working-directory: analyzer
        run: pytest -q -m "not contract and not integration_mock and not measurement"

  # Added by M3-5c's cold run, which is when it became visible that `make ci` had two
  # targets no workflow ran. The backend's 47 tests -- route-table posture, the spend
  # breaker's fail-closed semantics, cache staleness -- had only ever executed on the
  # author's laptop, in a venv whose fastapi came from an ad-hoc install written down
  # nowhere. "Green on every PR" and "green where it was written" are different claims and
  # only the first is worth anything at a gate.
  backend:
    name: backend (route table, breaker, cache staleness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      # The file that did not exist until the cold run. Installing it here rather than
      # relying on fastapi arriving as somebody else's transitive dependency is the whole
      # point of declaring it.
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests/test_api.py -q

  # E10's evidence line says "`make faithfulness-check` in CI". That was true of `make ci`
  # and false of every workflow, which is the gap this job closes: the committed panel is
  # the artifact the faithfulness surface renders, and a panel that has drifted from S4's
  # records is a published number with no producer.
  faithfulness-check:
    name: committed faithfulness panel matches S4's records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      - run: python scripts/build_faithfulness_panel.py --check

  contract:
    name: contract (span trees, ReasoningReport schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      # **This job is the G1 freeze.** The four report fixtures are re-validated against
      # the committed schema on every PR; a fixture that stops validating is a schema
      # change, and after G1 a schema change is a plan amendment (C3.3).
      - name: replay span trees (the step_id uniqueness contract reads them)
        run: make spans
        env:
          MOCK_LLM: "1"
      - working-directory: analyzer
        run: pytest -q -m contract

  integration-mock:
    name: integration-mock (cassette replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      # `out/spans` is gitignored -- it is derived, and committing derived data is how the
      # derivation quietly stops being run. Replayed here from the committed cassettes,
      # which is also a second assertion: if the generation cassettes no longer produce
      # valid span trees, this fails before the pipeline tests do.
      - name: replay span trees from cassettes
        run: make spans
        env:
          MOCK_LLM: "1"
      # No network: the point of MOCK_LLM=1 is that CI is deterministic and cost-free.
      # MODEL_ANALYZE is set even here, and it is not ceremony: a cassette records a
      # (model, prompt) pair and replay verifies both, so that a replayed report's
      # `judge_triage_pin` is true rather than decorative. It is a public model id.
      - run: ./scripts/run_marker.sh integration_mock
        env:
          MOCK_LLM: "1"
          MODEL_ANALYZE: "gpt-5-mini-2025-08-07"
          ANALYZER_BACKEND: "hybrid"

  calibration-page:
    name: calibration page hard-codes no numbers (E9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # B0 Condition #5 says the calibration page ships with whatever numbers we get. One
      # literal that crept in during a layout tweak would not look wrong to a reader, would
      # not fail a test, and would quietly turn the page from a measurement into a brochure.
      - run: ./scripts/check_calibration_page.sh

  rubric-drift:
    name: rubric/prompt taxonomy drift (C5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cheapest defence named in the plan. If the taxonomy the annotator reads and
      # the taxonomy the classifier is given drift apart, Cohen's kappa measures the
      # difference in WORDING and reports it as classifier quality -- invisibly, because
      # both files still read sensibly and the number just comes out lower.
      - run: ./scripts/check_rubric_drift.sh

  boundaries:
    name: import-linter boundary contract (I1 / C2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      - name: import-linter contracts
        working-directory: analyzer
        run: lint-imports --config ../.importlinter
      - name: provider-symbol grep (C2.2 rule 2)
        run: ./scripts/check_provider_symbols.sh

  schema-freeze:
    name: schema-freeze check (heldout-50.jsonl, C5.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/check_heldout_freeze.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

  prompt-bundle-version:
    name: prompt-bundle version is in step with prompts/ (C2.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./analyzer[dev]"
      - name: report the bundle version
        run: |
          python -c "from rlens import PROMPT_BUNDLE_VERSION as v; print('PROMPT_BUNDLE_VERSION =', v)"
